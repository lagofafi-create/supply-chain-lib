# Platform owned values only. Consumers provide their credential id, labels, platforms and notify
# address themselves. Overridden by config/registry.yaml and config/defaults.yaml in the workspace,
# then the file named in SC_CONFIG, then REGISTRY from the environment.
registry: artifactory.acme

# our organisation name, used only to refuse a vendor image labelled as ours
org: Acme

# upstream registry host to Artifactory remote repo (subdomain access: <remote>.<registry>/<image>)
pull:
  docker.io:                  dockerhub-remote
  registry.access.redhat.com: redhat-remote
  ghcr.io:                    ghcr-remote
  # registry.redhat.io (JBoss EAP and other authenticated Red Hat images) needs its own remote:
  # registry.redhat.io:         redhat-io-remote
  default:                    docker-remote

# Supply Chain API (signature verification, attestations, gate). Off until wired; SC_API_URL overrides the url.
api:
  enabled: false
  url: https://supply-chain.acme/api

credentials:
  api: supply-chain-api-token       # secret text credential: platform bearer token for the API

workRoot: .supplychain

# internal CA files under resources/certs/ (without .crt), injected by hardenImage
certs: [internal-ca-bundle]
certAliasPrefix: acme-internal      # keytool alias prefix in JVM cacerts (<prefix>-<n>)
